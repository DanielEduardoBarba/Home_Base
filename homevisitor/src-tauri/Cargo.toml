[package]
name = "homevisitor"
version = "1.16.0"
description = "Home Visitor — remote presence desktop window for Home Base"
authors = ["DevCon1 Solutions"]
edition = "2021"

[lib]
name = "homevisitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json"] }
urlencoding = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
